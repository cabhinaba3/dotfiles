[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#2a303c"
blue = "#a5b6f5"
cyan = "#99d1db"
green = "#b8e0a8"
magenta = "#f5c2e7"
red = "#ea999c"
white = "#dce0e8"
yellow = "#eed49f"

[colors.cursor]
cursor = "#c6d0f5"
text = "#1e222a"

[colors.normal]
black = "#1e222a"
blue = "#8caaee"
cyan = "#81c8be"
green = "#a6d189"
magenta = "#f4b8e4"
red = "#e78284"
white = "#c6d0f5"
yellow = "#e5c890"

[colors.primary]
background = "#1e222a"
bright_foreground = "#dce0e8"
foreground = "#c6d0f5"

[font]
size = 9.0


[[keyboard.bindings]]
action = "Paste"
key = "V"
mode = "~Vi"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "SearchForward"
key = "F"
mode = "~Search"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "SearchBackward"
key = "B"
mode = "~Search"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ClearSelection"
key = "C"
mode = "Vi|~Search"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "NumpadAdd"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "NumpadSubtract"
mods = "Control"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "T"
mods = "Control|Shift"

[cursor]
blink_interval = 600
blink_timeout = 0
thickness = 0.8
unfocused_hollow = true

[cursor.style]
shape="Beam"
blinking = "On"

[cursor.vi_mode_style]
shape = "Block"
blinking = "Off"
