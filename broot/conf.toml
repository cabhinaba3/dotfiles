###############################################################
# Broot Configuration File
# Usually placed in ~/.config/broot/conf.toml
###############################################################

default_flags = "g" # "g" means respect gitignore by default

[special-paths]
"~" = "no-enter" # Don't automatically expand the home directory

[search-modes]
"file" = "fuzzy"
"dir" = "fuzzy"

# Define custom verbs (commands)
[[verbs]]
invocation = "edit"
key = "F2"
shortcut = "e"
execution = "$EDITOR {file}"
leave_broot = false

[[verbs]]
invocation = "terminal"
key = "ctrl-t"
execution = "$SHELL"
set_working_dir = true
leave_broot = true

# Nord Dark Theme colors for Broot
[skin]
default = "gray(23) None / gray(20) None"
tree = "gray(10) None / gray(7) None"
file = "gray(21) None / gray(15) None"
directory = "rgb(129, 161, 193) None Bold / rgb(129, 161, 193) None" # Nord blue (#81A1C1)
exe = "rgb(163, 190, 140) None / rgb(163, 190, 140) None" # Nord green (#A3BE8C)
link = "rgb(136, 192, 208) None / rgb(136, 192, 208) None" # Nord cyan (#88C0D0)
primal = "gray(21) None"
dates = "gray(12) None"
