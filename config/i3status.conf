# i3status configuration (Nord, minimal, no emoji)

general {
        colors = true
        color_good = "#A3BE8C"
        color_degraded = "#EBCB8B"
        color_bad = "#BF616A"
        interval = 5
        separator = " | "
}

order += "wireless wlan0"
order += "ethernet eth0"
order += "battery 0"
order += "volume master"
order += "tztime local"

wireless wlan0 {
        format_up = "W: %essid %quality"
        format_down = "W: down"
}

ethernet eth0 {
        format_up = "E: %ip"
        format_down = ""
}

battery 0 {
        format = "%status %percentage %remaining"
        status_chr = "CHR"
        status_bat = "BAT"
        status_unk = "UNK"
        status_full = "FULL"
        low_threshold = 20
        threshold_type = percentage
        path = "/sys/class/power_supply/BAT%d/uevent"
}

volume master {
        format = "VOL: %volume"
        format_muted = "VOL: muted"
        device = "default"
        mixer = "Master"
        mixer_idx = 0
}

tztime local {
        format = "%Y-%m-%d %H:%M"
}
