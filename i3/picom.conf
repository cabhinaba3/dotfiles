# picom.conf - Optimized for low CPU/GPU usage
backend = "glx";
vsync = true;
use-damage = true;
unredirect-if-opaque = true;

# Transparency: Default to opaque (1.0) so the compositor can skip hidden windows
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Fading: 10ms timer interval avoids high-frequency timer wakeups
fading = true;
fade-delta = 10;
fade-in-step = 0.03;
fade-out-step = 0.03;

wintypes:
{
  dock = { opacity = 1.0; shadow = false; };
  tooltip = { fade = true; opacity = 0.95; focus = true; };
};

