# Nord inspired minimal tmux config

# Change prefix to Ctrl-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support
set -g mouse on

# Base index 1
set -g base-index 1
setw -g pane-base-index 1

# Vi style keybindings in copy mode
setw -g mode-keys vi

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Vim-like pane navigation (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Scrollback lines
set -g history-limit 50000

# Fast escape time
set -sg escape-time 0

# True color support
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"

# Renumber windows
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Status Bar (Minimalist) ---
set -g status-bg "#2E3440"
set -g status-fg "#D8DEE9"
set -g status-left "#[bold] #S "
set -g status-left-length 30

set -g status-right "%Y-%m-%d %H:%M "

set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bold,reverse] #I:#W #[noreverse] "

# Pane borders
set -g pane-border-style fg="#4C566A"
set -g pane-active-border-style fg="#81A1C1"

# Old school block cursor in tmux
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
