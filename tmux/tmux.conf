# Nord inspired minimal tmux config

# Change prefix to Ctrl-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support
set -g mouse on

# Base index 1
set -g base-index 1
setw -g pane-base-index 1

# Vi style keybindings in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i 2>/dev/null || wl-copy 2>/dev/null || cat"

# Split panes using | and -, preserving current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-like pane navigation (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Scrollback lines
set -g history-limit 50000

# Fast escape time (10ms prevents packet-split escape sequences over SSH)
set -sg escape-time 10

# True color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Renumber windows
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Status Bar (Minimalist) ---
set -g status-interval 60
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left "#[bold] #S "
set -g status-left-length 30

set -g status-right "%Y-%m-%d %H:%M "

set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bold,reverse] #I:#W #[noreverse] "

# Pane borders
set -g pane-border-style fg="#4C566A"
set -g pane-active-border-style fg="#81A1C1"

# Cursor shaping
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
